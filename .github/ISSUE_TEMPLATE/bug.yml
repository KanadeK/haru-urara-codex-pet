name: Bug report
description: Report a reproducible pet, PetSight, installer, or packaging failure.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove private paths, tokens, and personal data from logs.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pet animation
        - PetSight
        - Install / repair / restore
        - Archive / release
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command and sanitized output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, Codex desktop version
    validations:
      required: true
